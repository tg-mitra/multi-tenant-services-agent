<svg viewBox="0 0 1560 700" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <style>
    .zone { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1.5; }
    .zoneLabel { fill:#334155; font-size:14px; font-weight:700; letter-spacing:0.4px; }
    .box { fill:#ffffff; stroke:#94a3b8; stroke-width:1.2; }
    .boxCompute { fill:#eff6ff; stroke:#60a5fa; }
    .boxData { fill:#f0fdf4; stroke:#4ade80; }
    .boxSecurity { fill:#fef2f2; stroke:#fca5a5; }
    .boxExternal { fill:#fdf4ff; stroke:#e9a8f2; }
    .boxTenantA { fill:#eff6ff; stroke:#60a5fa; }
    .boxTenantB { fill:#fff7ed; stroke:#fdba74; }
    .title { fill:#0f172a; font-size:13px; font-weight:700; }
    .sub { fill:#475569; font-size:11px; }
    .tiny { fill:#64748b; font-size:10px; }
    .edge { fill:none; stroke:#475569; stroke-width:1.5; marker-end:url(#arrow); }
    .edgeDashed { fill:none; stroke:#475569; stroke-width:1.3; stroke-dasharray:5,4; marker-end:url(#arrow); }
    .edgeRed { fill:none; stroke:#b91c1c; stroke-width:1.7; marker-end:url(#arrowRed); }
    .edgeLabel { fill:#334155; font-size:10.5px; }
    .edgeLabelRed { fill:#b91c1c; font-size:10.5px; font-weight:600; }
    .heading { fill:#0f172a; font-size:21px; font-weight:800; }
    .sectionNote { fill:#64748b; font-size:11.5px; }
  </style>

  <text x="24" y="28" class="heading">Governed Multi-Tenant Member-Services Agent — Target AWS Deployment</text>
  <text x="24" y="47" class="sectionNote">Single region, multi-AZ. Solid grey = read path. Dashed = read-only reference data. Red = the one write path (grievance filing), gated on the rep's confirmation.</text>

  <!-- EDGE / IDENTITY ZONE -->
  <rect x="24" y="64" width="270" height="230" rx="12" class="zone"/>
  <text x="38" y="84" class="zoneLabel">EDGE &amp; IDENTITY</text>

  <rect x="40" y="98" width="238" height="42" rx="6" class="box"/>
  <text x="52" y="117" class="title">Rep desktop app / CLI</text>
  <text x="52" y="132" class="sub">member-services workstation</text>

  <rect x="40" y="152" width="238" height="42" rx="6" class="boxSecurity"/>
  <text x="52" y="171" class="title">API Gateway + WAF</text>
  <text x="52" y="186" class="sub">TLS, rate limiting, request caps</text>

  <rect x="40" y="206" width="238" height="42" rx="6" class="boxSecurity"/>
  <text x="52" y="225" class="title">IdP (OIDC / client SSO)</text>
  <text x="52" y="240" class="sub">rep identity -&gt; tenant + rep_id claim</text>

  <text x="40" y="270" class="tiny">The tenant comes from this claim only —</text>
  <text x="40" y="283" class="tiny">the model never chooses it.</text>

  <!-- COMPUTE ZONE -->
  <rect x="318" y="64" width="430" height="300" rx="12" class="zone"/>
  <text x="332" y="84" class="zoneLabel">COMPUTE — ECS Fargate, 2+ AZs, autoscaled</text>

  <rect x="334" y="98" width="398" height="40" rx="6" class="boxCompute"/>
  <text x="346" y="116" class="title">FastAPI app container</text>
  <text x="346" y="131" class="sub">validates request, loads session, per-conversation turn lock</text>

  <rect x="334" y="146" width="398" height="46" rx="6" class="boxCompute"/>
  <text x="346" y="164" class="title">LangGraph agent loop</text>
  <text x="346" y="179" class="sub">system prompt, bounded model &lt;-&gt; tool steps, budget checks</text>

  <rect x="334" y="200" width="398" height="60" rx="6" class="boxCompute"/>
  <text x="346" y="218" class="title">Tool Gateway — single enforcement point</text>
  <text x="346" y="233" class="sub">injects tenant/member from session, PHI allow-list,</text>
  <text x="346" y="246" class="sub">claim-ownership check, idempotent writes, trace events</text>

  <rect x="334" y="270" width="190" height="60" rx="6" class="boxCompute"/>
  <text x="346" y="288" class="title">RAG retrieval</text>
  <text x="346" y="303" class="sub">BM25 over plan docs,</text>
  <text x="346" y="316" class="sub">tenant+product+year filter</text>

  <rect x="540" y="270" width="192" height="60" rx="6" class="boxCompute"/>
  <text x="552" y="288" class="title">Calculators</text>
  <text x="552" y="303" class="sub">deductible / OOP / PT left,</text>
  <text x="552" y="316" class="sub">appeal &amp; grievance deadlines</text>

  <!-- DATA ZONE -->
  <rect x="776" y="64" width="310" height="300" rx="12" class="zone"/>
  <text x="790" y="84" class="zoneLabel">DATA — per-tenant isolation</text>

  <rect x="792" y="98" width="278" height="54" rx="6" class="boxData"/>
  <text x="804" y="116" class="title">Aurora PostgreSQL (multi-AZ)</text>
  <text x="804" y="131" class="sub">sessions, pending actions, idempotency keys</text>
  <text x="804" y="144" class="tiny">row-level security on tenant_id</text>

  <rect x="792" y="162" width="278" height="54" rx="6" class="boxData"/>
  <text x="804" y="180" class="title">S3 + Object Lock (WORM)</text>
  <text x="804" y="195" class="sub">append-only audit log, 6-year retention</text>
  <text x="804" y="208" class="tiny">per-tenant prefix and KMS key</text>

  <rect x="792" y="226" width="278" height="46" rx="6" class="boxData"/>
  <text x="804" y="244" class="title">S3: plan documents (kb/)</text>
  <text x="804" y="259" class="sub">versioned, read-only to the app</text>

  <rect x="792" y="282" width="278" height="56" rx="6" class="boxSecurity"/>
  <text x="804" y="300" class="title">Secrets Manager + per-tenant KMS</text>
  <text x="804" y="315" class="sub">tenant API tokens, directory key, LLM key —</text>
  <text x="804" y="328" class="tiny">never in app code, logs or traces</text>

  <!-- EXTERNAL ZONE -->
  <rect x="1116" y="64" width="420" height="300" rx="12" class="zone"/>
  <text x="1130" y="84" class="zoneLabel">EXTERNAL SYSTEMS — private connectivity</text>

  <rect x="1132" y="98" width="184" height="80" rx="6" class="boxTenantA"/>
  <text x="1144" y="117" class="title">Plan A platform</text>
  <text x="1144" y="132" class="sub">member / benefits</text>
  <text x="1144" y="145" class="sub">claims / grievances</text>
  <text x="1144" y="161" class="tiny">own bearer token</text>

  <rect x="1336" y="98" width="184" height="80" rx="6" class="boxTenantB"/>
  <text x="1348" y="117" class="title">Plan B platform</text>
  <text x="1348" y="132" class="sub">member / benefits</text>
  <text x="1348" y="145" class="sub">claims / grievances</text>
  <text x="1348" y="161" class="tiny">own bearer token</text>
  <line x1="1316" y1="106" x2="1316" y2="300" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,4"/>
  <text x="1264" y="192" class="tiny" transform="rotate(90 1264,192)">tenant boundary</text>

  <rect x="1132" y="192" width="388" height="50" rx="6" class="boxExternal"/>
  <text x="1144" y="210" class="title">CareFinder provider directory (vendor)</text>
  <text x="1144" y="225" class="sub">our own tool wrapper — no member identifiers sent</text>

  <rect x="1132" y="254" width="388" height="50" rx="6" class="boxExternal"/>
  <text x="1144" y="272" class="title">LLM provider (OpenAI-compatible)</text>
  <text x="1144" y="287" class="sub">PrivateLink / VPC egress, zero-retention agreement</text>

  <rect x="1132" y="314" width="388" height="38" rx="6" class="box"/>
  <text x="1144" y="337" class="tiny">The gateway always uses the SESSION tenant's own token and path</text>

  <!-- OBSERVABILITY STRIP -->
  <rect x="318" y="380" width="1218" height="56" rx="10" class="zone"/>
  <text x="332" y="400" class="zoneLabel">OBSERVABILITY</text>
  <rect x="334" y="408" width="384" height="22" rx="5" class="box"/>
  <text x="344" y="423" class="sub">CloudWatch: p95 latency, cost/conversation, budget stops</text>
  <rect x="730" y="408" width="384" height="22" rx="5" class="box"/>
  <text x="740" y="423" class="sub">Redacted structured logs only — no PHI, no prompts, no replies</text>
  <rect x="1126" y="408" width="406" height="22" rx="5" class="box"/>
  <text x="1136" y="423" class="sub">Alarms: 429/503 rate, repeated 503 on grievance writes, gate failures</text>

  <!-- ARROWS: edge -> compute -->
  <path d="M278,119 L334,117" class="edge"/>
  <path d="M278,227 L334,165" class="edge"/>
  <text x="282" y="245" class="edgeLabel">tenant + rep_id</text>

  <!-- COMPUTE internal -->
  <path d="M533,138 L533,146" class="edge"/>
  <path d="M533,192 L533,200" class="edge"/>
  <path d="M460,260 L440,270" class="edge"/>
  <path d="M600,260 L630,270" class="edge"/>

  <!-- COMPUTE -> DATA -->
  <path d="M732,225 C760,225 770,120 792,118" class="edge"/>
  <text x="736" y="215" class="edgeLabel">session / pending (read-write)</text>

  <path d="M732,240 C760,240 770,185 792,185" class="edgeRed"/>
  <text x="736" y="262" class="edgeLabelRed">audit append — every step</text>

  <path d="M524,300 C690,264 730,249 792,249" class="edgeDashed"/>
  <text x="600" y="256" class="edgeLabel">read-only KB load</text>

  <path d="M732,250 C760,280 770,305 792,308" class="edgeDashed"/>
  <text x="736" y="300" class="edgeLabel">read tenant token / keys</text>

  <!-- COMPUTE -> EXTERNAL (labelled once in the legend below, not here, to avoid crowding) -->
  <path d="M732,220 C920,150 1000,135 1132,135" class="edge"/>
  <path d="M732,228 C950,175 1050,185 1132,195" class="edge"/>
  <path d="M732,180 C950,230 1050,250 1132,265" class="edge"/>

  <!-- the one write path: proposal -> confirm -> POST (same target as the read arrow, different height: read vs write) -->
  <path d="M732,245 C900,205 1020,182 1132,166" class="edgeRed"/>

  <!-- LEGEND: what each arrow into the external zone means (kept separate from the diagram to avoid crowding) -->
  <rect x="24" y="452" width="1512" height="108" rx="10" class="zone"/>
  <text x="38" y="472" class="zoneLabel">LEGEND — compute to external-system arrows</text>

  <line x1="40" y1="488" x2="72" y2="488" class="edge"/>
  <text x="80" y="492" class="sub">Read: member / benefits / claims, using the session tenant's own bearer token</text>

  <line x1="40" y1="506" x2="72" y2="506" class="edge"/>
  <text x="80" y="510" class="sub">Read: provider directory search — specialty + network + zip only, no member identifier</text>

  <line x1="40" y1="524" x2="72" y2="524" class="edge"/>
  <text x="80" y="528" class="sub">Read: model call — minimised prompt (PHI allow-list applied) and the tool schema</text>

  <line x1="40" y1="542" x2="72" y2="542" class="edgeRed"/>
  <text x="80" y="546" class="edgeLabelRed">Write (the only one): POST grievance with Idempotency-Key — only after the rep's own message confirms it, exactly once</text>

  <!-- footer -->
  <rect x="24" y="568" width="1512" height="112" rx="10" class="zone"/>
  <text x="38" y="588" class="zoneLabel">WHAT THIS DIAGRAM GUARANTEES</text>
  <text x="38" y="610" class="sub">1. Tenant and member come only from the signed-in session (via the IdP claim), never from the model — the Tool Gateway injects them into every downstream call.</text>
  <text x="38" y="630" class="sub">2. The model can only PROPOSE a grievance; the gateway files it, and only after the rep's own next message is classified as a confirmation (red path).</text>
  <text x="38" y="650" class="sub">3. Every step (model call, tool call, gateway decision) is appended to the audit log in WORM storage; the log holds ids and hashes, never PHI or message text.</text>
</svg>
